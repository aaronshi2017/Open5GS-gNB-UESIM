logger:
  file:
    path: /opt/open5gs/var/log/open5gs/upf.log

global:
  max:
    ue: 64

upf:
  pfcp:
    server:
      - address: 127.0.0.7
  gtpu:
    server:
      - address: 10.33.33.4      # container IP the gNB sends GTP-U to (N3)
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
      dev: ogstun2
  metrics:
    server:
      - address: 127.0.0.7
        port: 9090
