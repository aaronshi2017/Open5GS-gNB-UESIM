db_uri: mongodb://mongo/open5gs

logger:
  file:
    path: /opt/open5gs/var/log/open5gs/pcf.log

global:
  max:
    ue: 64

pcf:
  sbi:
    server:
      - address: 127.0.0.13
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  metrics:
    server:
      - address: 127.0.0.13
        port: 9090
